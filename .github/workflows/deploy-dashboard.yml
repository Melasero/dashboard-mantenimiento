name: Publicar Dashboard Ejecutivo

on:
  schedule:
    # 10:30 y 22:30 UTC = 05:30 y 17:30 hora Lima (Peru es UTC-5 todo el ano,
    # sin horario de verano). Esto es solo un respaldo -- el disparo real lo
    # hace el Apps Script de la Seccion 7 justo despues de subir el Excel
    # fresco al repo; este cron solo entra a tallar si ese disparo fallara.
    - cron: "30 10,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install --quiet pandas numpy plotly openpyxl

      - name: Generar dashboard
        run: python "Dashboard_Ejecutivo_Mantenimiento_v6.py"

      - name: Publicar como index.html
        run: |
          cp "Dashboard_Ejecutivo_Mantenimiento.html" index.html
          git config user.name "Dashboard Publisher Bot"
          git config user.email "actions@github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Actualiza dashboard ejecutivo (automatico)"
            git push
          fi
